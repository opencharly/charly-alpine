# charly-alpine — the Alpine package repository for charly.
#
# This project exists so this repo OWNS the R10 bed that proves its own
# published artifact: check-alpine-repo deploys a disposable Alpine container
# pod (a raw registry image cannot be a pod's `image:`, and Alpine's
# cloud-init/OpenRC path is not systemd, so a container is the honest
# substrate), adds the published charly apk repo
# (opencharly.github.io/charly-alpine), installs the packaged charly, and
# asserts the installed binary's version equals the version the package manager
# recorded. The bed was relocated here from opencharly/charly's charly.yml —
# the artifact owner is the repo that publishes the repo.
version: 2026.261.1747
repo: github.com/opencharly/charly-alpine
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - apk
    merge:
        auto: false
        max_mb: 128

# sudo-nopasswd — grants the uid-1000 account passwordless sudo, for a check bed
# that must drive a native package manager IN-CONTAINER.
#
# This is a documented WORKAROUND for a product gap, not a design choice. A
# charly box runs as uid 1000 (WriteBootstrap has no root branch), and the check
# executor does NOT honour `run_as:` on a check step: the build/install timeline
# resolves op.RunAs through ResolveUserSpec (host_build_construct_step.go ->
# stepConstructCtx.RunAsUser), but the check-runner path never reads it. So an
# in-container `apk add` has no elevation path until the check executor honours
# `run_as` on check steps — the owning fix is in the compiled-in `command:check`
# plugin (opencharly/plugin-check), which owns every check-run mode body. WHEN
# THAT LANDS THIS CANDY IS DELETED and the bed's steps carry `run_as: root`.
#
# R3: this grant and the one the sshd candy writes (/charly-coder:sshd,
# candy/sshd in opencharly/pod-sshd) implement the same rule from two repos. The
# sshd grant is a side effect of provisioning SSH; this candy is the focused
# grant the bed needs WITHOUT an SSH daemon, so composing sshd here would pull an
# unrelated service into a minimal Alpine bed. A single shared candy both repos
# depend on is a cross-repo cutover (pod-sshd would have to compose it), which is
# why this phase carries two copies rather than one.
sudo-nopasswd:
    candy:
        version: 2026.229.0900
        description: |-
            Installs sudo and grants the uid-1000 account passwordless sudo via
            /etc/sudoers.d/charly-user, for a check bed that must drive a native
            package manager IN-CONTAINER.
        distro:
            alpine:
                package:
                    - sudo
        plan:
            - run: grant the uid-1000 account passwordless sudo
              run_as: root
              command: |
                account=$(getent passwd 1000 | cut -d: -f1)
                if [ -z "$account" ]; then
                  echo "sudo-nopasswd: no uid-1000 account found, refusing to write sudoers" >&2
                  exit 1
                fi
                printf '%s ALL=(ALL) NOPASSWD: ALL\n' "$account" > /etc/sudoers.d/charly-user
                chmod 0440 /etc/sudoers.d/charly-user
            - check: the sudo binary is installed
              id: sudo-nopasswd-binary
              exit_status: 0
              command: command -v sudo
            - check: passwordless sudo works and the drop-in is mode 0440
              id: sudo-nopasswd-sudoers
              exit_status: 0
              stdout:
                - contains: "440"
              # Routed THROUGH sudo deliberately: /etc/sudoers.d is 0750 root:root,
              # so the uid-1000 account cannot stat inside it directly. Reading the
              # mode via sudo proves both halves at once — the drop-in is 0440 AND
              # the NOPASSWD rule actually grants elevation.
              command: sudo -n stat -c '%a' /etc/sudoers.d/charly-user

# alpine-repo-box — the check-alpine-repo bed's pod workload. A minimal Alpine
# base box (a raw registry image cannot be a pod's `image:` — the check-bed
# runner resolves it as a box name) whose OCI labels the pod deploy reads to
# start the container (no init → sleep infinity). The repo-install check steps
# run in-container.
alpine-repo-box:
    candy:
        version: 2026.225.1508
        base: docker.io/library/alpine:3.24
        description: |-
            Minimal Alpine base box — the check-alpine-repo bed's pod workload.
        candy:
            - sudo-nopasswd
        build:
            - apk
        distro:
            - alpine
        plan:
            - check: the alpine base image is present
              id: alpine-base-present
              exit_status: 0
              command: cat /etc/alpine-release
check-alpine-repo:
    pod:
        image: alpine-repo-box
        disposable: true
        lifecycle: dev
        description: >-
            Proves the repo-based install from the published charly-alpine apk repo (opencharly.github.io/charly-alpine) — the R10 acceptance for the nFPM packaging cutover's Alpine leg. Deploys a disposable Alpine container pod (alpine-repo-box — a raw registry image cannot be a pod's `image:`, and Alpine's cloud-init/OpenRC path is not systemd, so a container is the honest substrate), installs the charly RSA key + adds the apk repo, `apk add charly`, asserts the PACKAGED /usr/bin/charly reports the same version the package manager recorded for the installed package, and proves the welded command plugins dispatch project-less from /tmp.
        install_opts:
            allow_repo_changes: true
            allow_root_tasks: true
        plan:
            - check: the charly apk repo RSA key is installed and the repo is added
              id: alpine-repo-key-and-repo
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apk add --no-cache curl &&
                sudo curl -fsSL -o /etc/apk/keys/charly.rsa.pub https://opencharly.github.io/charly-alpine/charly.rsa.pub &&
                echo 'https://opencharly.github.io/charly-alpine/amd64' | sudo tee -a /etc/apk/repositories >/dev/null &&
                grep -q '^https://opencharly.github.io/charly-alpine/amd64$' /etc/apk/repositories
            - check: apk update resolves the charly repo
              id: alpine-apk-update
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              # `apk update` alone exits 0 even when a repo is unreachable — it
              # warns and carries on — so it cannot prove the charly index was
              # fetched. Listing the package proves it: `charly` is in no Alpine
              # repo, so a non-empty listing is only possible from the charly
              # index at <repo>/<apk-arch>/APKINDEX.tar.gz.
              command: |
                sudo apk update &&
                apk list charly | grep -q '^charly-'
            - check: apk add charly installs the package
              id: alpine-charly-installed
              timeout: 10m
              exit_status: 0
              context:
                - runtime
              command: |
                sudo apk add charly &&
                apk info -e charly
            - check: charly version equals the repo's published CalVer
              id: alpine-charly-version
              exit_status: 0
              stdout:
                - contains: ALPINE-REPO-VERSION-OK
              context:
                - runtime
              command: |
                installed="$(/usr/bin/charly version)" &&
                packaged="$(apk list --installed charly | sed -n 's/^charly-\([0-9][0-9.]*\) .*/\1/p')" &&
                echo "installed=[$installed] packaged=[$packaged]" &&
                test -n "$installed" && test -n "$packaged" &&
                test "$installed" = "$packaged" &&
                echo ALPINE-REPO-VERSION-OK
            - check: the welded command plugins dispatch project-less from /tmp
              id: alpine-welded-command-project-less
              exit_status: 0
              stdout:
                - contains: ALPINE-WELDED-CMD-OK
              context:
                - runtime
              command: |
                cd /tmp &&
                charly doctor 2>/dev/null | grep -q 'Summary:' &&
                echo ALPINE-WELDED-CMD-OK
