name: build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'charly release CalVer to package (e.g. 2026.227.1026)'
        required: true
      charly_lib_version:
        description: 'charly-lib release TAG (pinned) to fetch the shared host from'
        required: true
        default: 'v2026.256.1131'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download charly release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin plugins
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-linux-*' --dir bin
          for f in bin/charly-linux-*; do
            mv "$f" "bin/charly-${f#bin/charly-linux-}"
          done
          gh release download v${{ inputs.version }} --repo opencharly/charly \
            --pattern 'charly-candy-charly.yml' --dir .
          # The welded plugins no longer ship as per-plugin binaries: the shared
          # charly-lib host serves them all (opencharly/sdk#258 packagekit hard
          # cutover). Its host + .providers manifests are fetched next.

      - name: Download the charly-lib shared plugin host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p plugins/amd64 plugins/arm64 .charly-lib
          gh release download "${{ inputs.charly_lib_version }}" --repo opencharly/charly-lib \
            --pattern 'charly-lib-linux-amd64' \
            --pattern 'charly-lib-linux-arm64' \
            --pattern '*.providers' --dir .charly-lib --clobber
          for arch in amd64 arm64; do
            # The host binary (downloaded non-executable) + one plugin-<word>
            # symlink per welded plugin + its .providers manifest — the ONE
            # layout packagekit accepts.
            install -m0755 ".charly-lib/charly-lib-linux-$arch" "plugins/$arch/charly-lib"
            for f in .charly-lib/*.providers; do
              n=$(basename "$f" .providers)
              cp "$f" "plugins/$arch/$n.providers"
              ln -sf charly-lib "plugins/$arch/$n"
            done
          done

      - name: Install charly + baked generate-packages plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo install -Dm755 bin/charly-amd64 /usr/local/bin/charly
          sudo mkdir -p /usr/lib/charly/plugins
          # Shared host once + plugin-<word> symlinks (the loader contract is
          # unchanged: a .providers manifest beside an executable named plugin-<word>).
          sudo install -Dm755 plugins/amd64/charly-lib /usr/lib/charly/plugins/charly-lib
          for f in plugins/amd64/*.providers; do
            n=$(basename "$f" .providers)
            sudo install -Dm644 "$f" "/usr/lib/charly/plugins/$n.providers"
            sudo ln -sf charly-lib "/usr/lib/charly/plugins/$n"
          done
          mkdir -p /tmp/plugin
          gh release download --repo opencharly/plugin-generate-packages \
            --pattern 'generate-packages-linux-amd64' \
            --pattern 'generate-packages.providers' --dir /tmp/plugin
          sudo install -Dm755 /tmp/plugin/generate-packages-linux-amd64 /usr/lib/charly/plugins/generate-packages
          sudo install -Dm644 /tmp/plugin/generate-packages.providers /usr/lib/charly/plugins/generate-packages.providers
          charly version

      - name: Write the RSA signing key
        run: |
          echo "${{ secrets.CHARLY_RSA_PRIVATE_KEY }}" > charly.rsa
          chmod 600 charly.rsa

      - name: Build packages
        env:
          CHARLY_PROJECT_DIR: ${{ github.workspace }}
        run: |
          rm -rf repo
          for variant in default full minimal; do
            for arch in amd64 arm64; do
              charly generate-packages \
                --candy charly-candy-charly.yml \
                --binary bin/charly-$arch \
                --plugins plugins/$arch \
                --version ${{ inputs.version }} \
                --arch $arch \
                --variant $variant \
                --formats apk \
                --out repo/$arch \
                --apk-signing-key charly.rsa
            done
          done

      - name: Assemble + sign the apk index
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws:rw" alpine:latest sh -c '
            set -e
            apk add --no-cache alpine-sdk
            # apk index verifies the package signatures against the keyring, so
            # the public key must be installed BEFORE indexing — a missing key
            # makes `apk index` exit 99 UNTRUSTED and silently produce no index.
            cp /ws/charly.rsa.pub /etc/apk/keys/charly.rsa.pub
            for arch in amd64 arm64; do
              case "$arch" in
                amd64) apkarch=x86_64 ;;
                arm64) apkarch=aarch64 ;;
              esac
              mkdir -p /ws/repo/$arch/$apkarch
              cd /ws/repo/$arch
              # nFPM names the .apk <name>_<version>_<arch>.apk, but apk derives
              # the package filename from the index as <name>-<version>.apk —
              # rename to the apk convention or apk reports "package mentioned
              # in index not found" (EAPKSTALEINDEX) at install time.
              for f in *_$apkarch.apk; do
                [ -e "$f" ] || continue
                base="${f%_$apkarch.apk}"
                name="${base%_*}"
                ver="${base##*_}"
                mv "$f" "$apkarch/$name-$ver.apk"
              done
              cd /ws/repo/$arch/$apkarch
              apk index -o APKINDEX.tar.gz *.apk
              abuild-sign -k /ws/charly.rsa APKINDEX.tar.gz
            done
          '

      - name: Create stable copies
        run: |
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) apkarch=x86_64 ;;
              arm64) apkarch=aarch64 ;;
            esac
            newest=$(ls repo/$arch/$apkarch/charly-*.apk | grep -v minimal | grep -v full | sort -V | tail -1)
            cp "$newest" repo/$arch/charly-$arch.apk
          done

      - name: Install-test
        run: |
          docker run --rm -e VERSION="$VERSION" -v "${{ github.workspace }}:/ws:ro" alpine:latest sh -c '
            set -e
            cp /ws/charly.rsa.pub /etc/apk/keys/charly.rsa.pub
            # Append the charly repo — replacing /etc/apk/repositories breaks
            # dependency resolution (the deps come from Alpine main/community).
            echo "file:///ws/repo/amd64" >> /etc/apk/repositories
            apk update
            apk add charly
            test "$(charly version)" = "$VERSION" || { echo "version mismatch: $(charly version) != $VERSION"; exit 1; }
            # The cutover real risk: the SHARED HOST must serve the welded
            # set through the plugin-<word> symlink + .providers contract. Assert
            # EVERY installed plugin is a symlink to charly-lib AND the host
            # serves it (the go-plugin handshake).
            test -x /usr/lib/charly/plugins/charly-lib || { echo "charly-lib shared host missing"; exit 1; }
            ls -l /usr/lib/charly/plugins
            _n=0
            for _m in /usr/lib/charly/plugins/*.providers; do
              _w=$(basename "$_m" .providers)
              test -L "/usr/lib/charly/plugins/$_w" || { echo "$_w: plugin symlink missing"; exit 1; }
              test "$(readlink "/usr/lib/charly/plugins/$_w")" = "charly-lib" || { echo "$_w: symlink does not target charly-lib"; exit 1; }
              CHARLY_PLUGIN=charly-plugin-v1 "/usr/lib/charly/plugins/$_w" >/tmp/_handshake 2>/dev/null &
              _p=$!
              sleep 1
              kill "$_p" 2>/dev/null
              _h=$(tail -1 /tmp/_handshake)
              case "$_h" in 1\|2\|*) ;; *) echo "$_w: shared host did not serve (got $_h)"; exit 1 ;; esac
              _n=$((_n + 1))
            done
            test "$_n" -ge 1 || { echo "no plugin manifests installed"; exit 1; }
            echo "shared-host serves all $_n welded plugins"
          '
        env:
          VERSION: ${{ inputs.version }}

      - name: Stage static files
        run: |
          # The upload path is repo/, so the committed landing page, .nojekyll,
          # and public key must be copied in or the site root 404s.
          cp index.html .nojekyll charly.rsa.pub repo/

      - name: Deploy to Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo
      - name: Deploy
        uses: actions/deploy-pages@v4
